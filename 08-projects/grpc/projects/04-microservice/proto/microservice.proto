syntax = "proto3";

option go_package = "./proto;microservice";

package microservice;

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc GetStats (StatsRequest) returns (StatsReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  string server_id = 2;
}

message StatsRequest {}

message StatsReply {
  int64 request_count = 1;
  int64 active_connections = 2;
}