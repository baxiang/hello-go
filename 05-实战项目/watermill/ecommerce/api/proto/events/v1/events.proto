syntax = "proto3";

package events.v1;

option go_package = "ecommerce/api/proto/events/v1;eventsv1";

// OrderCreated 订单创建事件
message OrderCreated {
	string order_id = 1;
	string user_id = 2;
	repeated OrderItem items = 3;
	double total = 4;
	int64 created_at = 5;
}

message OrderItem {
	string product_id = 1;
	int32 quantity = 2;
	double price = 3;
}

// InventoryReserved 库存预留成功
message InventoryReserved {
	string order_id = 1;
}

// InventoryInsufficient 库存不足
message InventoryInsufficient {
	string order_id = 1;
	string product_id = 2;
	int32 required = 3;
	int32 available = 4;
}

// PaymentRequested 请求支付
message PaymentRequested {
	string order_id = 1;
	double amount = 2;
	string user_id = 3;
}

// PaymentCompleted 支付完成
message PaymentCompleted {
	string order_id = 1;
	string payment_id = 2;
}

// PaymentFailed 支付失败
message PaymentFailed {
	string order_id = 1;
	string reason = 2;
}

// OrderConfirmed 订单确认
message OrderConfirmed {
	string order_id = 1;
	string payment_id = 2;
}

// OrderCancelled 订单取消（补偿）
message OrderCancelled {
	string order_id = 1;
	string reason = 2;
}

// InventoryRelease 恢复库存（补偿）
message InventoryRelease {
	string order_id = 1;
	repeated OrderItem items = 2;
}

// NotificationSent 通知已发送
message NotificationSent {
	string order_id = 1;
	string user_id = 2;
	string channel = 3;
	string content = 4;
}
